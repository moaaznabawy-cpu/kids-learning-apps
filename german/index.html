<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ffb400"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kids Learning · German Deutsch</title>
<style>
:root{--ink:#2b2350;--c1:#ff5a5f;--c2:#ffb400;--c3:#00c2a8;--c4:#7b5cff;--c5:#ff4fa3;--c6:#2bb0ff;--c7:#2e9f5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;
 background:linear-gradient(180deg,#7fe3ff 0%,#fff3b0 52%,#ffc8e6 100%)}
body:before,body:after{content:"";position:fixed;border-radius:50%;opacity:.35;z-index:0;animation:drift 9s ease-in-out infinite alternate}
body:before{width:220px;height:220px;background:#fff;left:-60px;top:18%}
body:after{width:300px;height:300px;background:#ffe14d;right:-110px;bottom:8%;animation-duration:12s}
@keyframes drift{to{transform:translate(30px,-40px) scale(1.1)}}
.ar{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic","Geeza Pro",serif}
.quran{font-family:"Amiri Quran","Scheherazade New","Noto Naskh Arabic","Amiri","Geeza Pro",serif;line-height:2.1}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
#top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;min-height:66px}
.btn{border:0;border-radius:24px;background:#fff;box-shadow:0 6px 0 rgba(43,35,80,.2);min-width:58px;min-height:58px;padding:8px 18px;font:inherit;font-size:22px;color:var(--ink);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,35,80,.2)}
.btn.go{background:linear-gradient(#ffd34d,#ffa400);font-weight:700}
#top .btn{font-size:28px}
#stars{font-size:26px;font-weight:700;background:#fff;border-radius:24px;padding:8px 18px;box-shadow:0 6px 0 rgba(43,35,80,.15)}
#stars.bump{animation:pop .5s}
#screen{flex:1;overflow-y:auto;padding:6px 14px 28px;-webkit-overflow-scrolling:touch}
h1{font-size:28px;text-align:center;margin:4px 0 12px;text-shadow:0 2px 0 #fff}
.sub{font-size:15px;opacity:.75;font-weight:400;display:block}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(2,1fr)}
.tile{border:0;border-radius:32px;color:#fff;padding:14px 8px;min-height:140px;font:inherit;font-size:25px;font-weight:700;box-shadow:0 9px 0 rgba(0,0,0,.2),inset 0 -6px 0 rgba(0,0,0,.08);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tile .big{font-size:54px;line-height:1.15;animation:wob 3s ease-in-out infinite}
.tile:nth-child(2n) .big{animation-delay:-1.2s}
.tile small{font-size:15px;font-weight:400;opacity:.95}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) scale(1.08)}}
.letters{grid-template-columns:repeat(4,1fr);direction:rtl}
.letters.en{direction:ltr}
.lt{border:0;border-radius:24px;background:#fff;box-shadow:0 6px 0 rgba(43,35,80,.18);min-height:80px;font-size:44px;color:var(--ink);cursor:pointer;font-family:"Noto Naskh Arabic","Amiri",serif}
.letters.en .lt{font-family:"Trebuchet MS",Arial,sans-serif;font-weight:700}
.lt:nth-child(5n+1){border-bottom:6px solid var(--c1)}.lt:nth-child(5n+2){border-bottom:6px solid var(--c2)}.lt:nth-child(5n+3){border-bottom:6px solid var(--c3)}.lt:nth-child(5n+4){border-bottom:6px solid var(--c4)}.lt:nth-child(5n){border-bottom:6px solid var(--c5)}
.lt.done{background:#d6ffe6}
.card{background:#fff;border-radius:36px;padding:16px;text-align:center;box-shadow:0 9px 0 rgba(43,35,80,.14);margin:10px 0}
.card .huge{font-size:120px;line-height:1.25}
.card .pic{font-size:84px;line-height:1.2;animation:pop .6s}
.word{font-size:34px;font-weight:700}
.gloss{font-size:22px;opacity:.75}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0;align-items:center}
.choice{border:0;border-radius:28px;background:#fff;box-shadow:0 7px 0 rgba(43,35,80,.18);min-width:98px;min-height:98px;font-size:54px;cursor:pointer;font-family:inherit;color:var(--ink)}
.choice:active{transform:translateY(4px)}
.choice.good{background:#a8f5c6;animation:pop .5s}.choice.bad{background:#ffd0d0;animation:shake .4s}
.slot{width:80px;height:94px;border-radius:22px;border:4px dashed #8a7fc0;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:52px}
.slot.full{border:4px solid var(--c7);background:#d6ffe6;animation:pop .4s}
.tileL{width:80px;height:88px;border-radius:22px;background:linear-gradient(#9a85ff,#6a4cff);color:#fff;font-size:50px;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(0,0,0,.2);touch-action:none;cursor:grab}
.tileL.used{opacity:.2;pointer-events:none}
.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.95;transform:scale(1.15)}
.mem{grid-template-columns:repeat(4,1fr)}
.mc{border:0;border-radius:24px;min-height:98px;font-size:48px;background:linear-gradient(#34e0c8,#00b39c);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer;font-family:"Noto Naskh Arabic",serif}
.mc.up{background:#fff;color:var(--ink)}.mc.gone{visibility:hidden}
.ayah{display:block;width:100%;border:0;background:#fff;border-radius:28px;padding:6px 14px;margin:10px 0;font-size:38px;text-align:center;box-shadow:0 6px 0 rgba(43,35,80,.14);color:var(--ink);cursor:pointer;direction:rtl;transition:background .2s}
.ayah.on{background:#fff0a6;box-shadow:0 0 0 5px var(--c2),0 6px 0 rgba(43,35,80,.14)}
.ayah .n{font-family:"Noto Kufi Arabic",sans-serif;font-size:18px;background:var(--c2);color:#fff;border-radius:50%;display:inline-block;width:34px;height:34px;line-height:34px;margin-inline-start:8px}
.hk{font-size:62px}
.note{font-size:14px;line-height:1.5;background:rgba(255,255,255,.85);border-radius:16px;padding:10px 14px;margin:10px 0}
label{display:block;margin:10px 0 4px;font-weight:700}
input[type=text]{width:100%;font:inherit;font-size:28px;padding:10px 14px;border-radius:16px;border:3px solid #ddd;user-select:text;-webkit-user-select:text}
.prog{height:20px;background:rgba(255,255,255,.7);border-radius:12px;overflow:hidden;margin:6px 0 12px}.prog>i{display:block;height:100%;background:linear-gradient(90deg,#ffb400,#ff5a5f);transition:width 1s linear}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.7);z-index:90;font-size:90px;text-align:center;pointer-events:none}
#pop div{font-size:34px;font-weight:700;margin-top:8px}
#pop.show{display:flex}#pop svg,#pop span{animation:pop .5s}
@keyframes shake{25%{transform:translateX(-9px) rotate(-2deg)}75%{transform:translateX(9px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mascot{animation:bob 2s ease-in-out infinite}
.bubble{background:#fff;border-radius:22px;padding:8px 16px;font-size:22px;font-weight:700;position:relative;box-shadow:0 5px 0 rgba(43,35,80,.14)}
#cv{position:fixed;inset:0;pointer-events:none;z-index:95}
#box{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#fff7c2,#ff9ed2);text-align:center}
#box.show{display:flex}
#gift{font-size:150px;cursor:pointer;animation:wob 1.2s ease-in-out infinite}
#gift.s1{animation:shake .4s infinite}
#box .t{font-size:30px;font-weight:700;margin:6px 14px}
/* balloons */
#sky{position:relative;height:56vh;min-height:360px;border-radius:30px;overflow:hidden;background:linear-gradient(#58c8ff,#c6f0ff);box-shadow:inset 0 0 0 5px #fff}
.bal{position:absolute;width:88px;height:108px;border-radius:50% 50% 47% 47%;display:flex;align-items:center;justify-content:center;font-size:46px;color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.1);will-change:transform;touch-action:manipulation}
.bal:after{content:"";position:absolute;left:50%;bottom:-16px;width:2px;height:18px;background:#fff}
.bal.ar{font-family:"Noto Naskh Arabic",serif}
.bal.pp{animation:pop .3s reverse forwards}
.bal.no{animation:shake .4s}
#prompt{text-align:center;font-size:30px;font-weight:700;margin:2px 0 8px}
.eq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:44px;font-weight:700;direction:ltr}
.eq .slot,.eq .res{min-width:80px}
.res{height:94px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;padding:0 14px;box-shadow:0 6px 0 rgba(43,35,80,.14)}
.merge{animation:pop .6s}
.obj{display:inline-block;font-size:46px;line-height:1.25;cursor:pointer;transition:transform .25s,opacity .25s}
.obj.off{opacity:.18;transform:scale(.6) rotate(20deg)}
.obj.hop{animation:pop .4s}
.pal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sw{width:62px;height:62px;border-radius:50%;border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.sw.sel{border-color:#2b2350;transform:scale(1.15)}
svg.paint{width:100%;max-width:340px;display:block;margin:0 auto;background:#fff;border-radius:30px;box-shadow:0 8px 0 rgba(43,35,80,.14)}
svg.paint [data-part]{cursor:pointer}
.stk{display:inline-block;background:#fff;border-radius:22px;padding:8px 12px;margin:6px;box-shadow:0 5px 0 rgba(43,35,80,.14);text-align:center}
.stk b{display:block;font-size:44px}.stk span{font-size:14px;display:block}
@media (min-width:700px){.letters{grid-template-columns:repeat(7,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}.mem{grid-template-columns:repeat(6,1fr)}}

body,button,.tile,.btn,.choice,.eq,.word,.note,.gloss{font-family:"KFredoka","KLalezar","Noto Kufi Arabic",Tahoma,sans-serif}
h1,h1.ar{font-family:"KFredoka","KLalezar",sans-serif;font-weight:700;font-size:34px;letter-spacing:.5px;background:linear-gradient(90deg,#e0245e,#e8590c,#1b9e4b,#1b6fd0,#7a3fe0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;}
h1 .sub{font-family:"KFredoka",sans-serif;font-weight:500;font-size:15px;color:#4a4270;background:none;-webkit-text-fill-color:#4a4270;filter:none}
.tile{font-size:24px;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile small{font-family:"KFredoka",sans-serif;font-weight:500;text-shadow:none}
.tile .big.ar{font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif}
.tile .big:not(.ar){font-family:"KFredoka","KLalezar",sans-serif;font-weight:700}
.letters .lt,.letters.en .lt{font-family:"KFredoka","KLalezar",sans-serif;font-weight:700}
.letters .lt:nth-child(6n+1){color:#e53935}.letters .lt:nth-child(6n+2){color:#f59e00}.letters .lt:nth-child(6n+3){color:#1faa5a}.letters .lt:nth-child(6n+4){color:#1b8de0}.letters .lt:nth-child(6n+5){color:#8a4dff}.letters .lt:nth-child(6n){color:#ee2a8a}
.word{font-family:"KFredoka","KLalezar",sans-serif;font-weight:700;background:linear-gradient(90deg,#e53935,#e8590c,#1b9e4b,#1b6fd0,#7a3fe0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(43,35,80,.15))}
.word.ar,.word .ar{font-family:"KLalezar","Noto Naskh Arabic",serif}
.choice{font-family:"KFredoka","KLalezar",sans-serif;font-weight:700}
.choice:nth-child(4n+1){color:#e53935}.choice:nth-child(4n+2){color:#1b8de0}.choice:nth-child(4n+3){color:#1faa5a}.choice:nth-child(4n){color:#8a4dff}
.eq{font-family:"KFredoka",sans-serif;font-weight:700}
.btn{font-family:"KFredoka","KLalezar",sans-serif;font-weight:600}
h1.qh{background:none;color:#2b2350;filter:none;-webkit-text-fill-color:#2b2350;font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif}
h1,h1.ar{background:none!important;-webkit-text-fill-color:#2b2350;color:#2b2350;text-shadow:0 2px 0 rgba(255,255,255,.8)}h1 .sub{-webkit-text-fill-color:#4a4270}.word{background:none!important;-webkit-text-fill-color:currentColor;color:#2b2350;filter:none}

/* v15 fonts: English Trebuchet MS, Arabic Calibri (Calibri has no Arabic letters, so the device falls back letter by letter) */
*{font-family:"Trebuchet MS","Helvetica Neue",Calibri,Tahoma,"Segoe UI","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic",Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif!important}
.ar,.ar *,[dir=rtl],[dir=rtl] *{font-family:Calibri,"Trebuchet MS",Tahoma,"Segoe UI","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic",Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif!important}
.quran,.quran *,h1.qh,.qh,.ayah{font-family:"Amiri Quran","Scheherazade New","Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic",serif!important}
.word,h1,.btn,.tile{font-weight:700}

#top{gap:6px}#top .btn{padding-left:10px;padding-right:10px}
.tiles{gap:8px!important}.tile{min-height:104px!important;font-size:19px!important;border-radius:24px!important;padding:8px 4px!important}
.tile .big{font-size:32px!important}.tile small{font-size:12px!important}
h1,h1.ar{font-size:26px!important;margin:4px 0!important}
.surs{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
.surs .tile{min-height:60px!important;flex-direction:column!important;gap:0!important}.surs .tile .ar{font-size:24px!important}.surs .tile small{font-size:11px!important}
.bobE{animation:bobE 1.6s ease-in-out infinite}@keyframes bobE{50%{transform:translateY(-8px) scale(1.06)}}</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="app">
 <div id="top"><button class="btn" id="back" aria-label="back">🏠</button><div id="stars">⭐ 0</div><button class="btn" id="gd" aria-label="guide">❓</button><button class="btn" id="gear" aria-label="settings">⚙️</button></div>
 <div id="screen"></div>
</div>
<div id="pop"><span id="popE">🌟</span><div id="popT"></div></div>
<div id="box"><div class="t ar" id="boxT1">اضغط على الهدية!<span class="sub">Tap the gift!</span></div><div id="gift">🎁</div><div class="t" id="boxT2"></div><button class="btn go" id="boxOk" style="display:none;margin-top:12px">👍</button></div>

 const face=c=>c.k==='l'?L[c.i][0]:(ar?L[c.i][3]:L[c.i][2]);
 scr.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('up'))return;const c=cards[b.dataset.n];b.classList.add('up');b.textContent=face(c);popS();

  else{lock=true;const a=first.b;first=null;oops();later(()=>{a.classList.remove('up');a.textContent='?';b.classList.remove('up');b.textContent='?';lock=false},900)}})}

function buildWord(lang){const ar=lang==='ar';const W=ar?AW:CVC;const w=W[rnd(0,W.length-1)];
 const chars=Array.from(w[0]);
 const extra=pick((ar?AL.map(l=>l[0].replace('هـ','ه')):'abcdefghijklmnopqrstuvwxyz'.split('')).filter(c=>!chars.includes(c)),2);
 const eq=chars.map((c,i)=>`<div class="slot ${ar?'ar':''}" data-ch="${c}"></div>${i<chars.length-1?'<span>+</span>':''}`).join('');
 scr.innerHTML=(ar?title('حرف + حرف = كلمة','Letter + letter = word'):'<h1>Blend the letters!<span class="sub ar">حرف + حرف = كلمة</span></h1>')+`<div class="card"><div class="pic" id="pic">❓</div><div class="gloss">${ar?w[2]:w[2]}</div></div><div class="eq" id="eq" style="direction:${ar?'rtl':'ltr'}">${eq}<span>=</span><div class="res" id="res">?</div></div><div class="row" id="pool">`+shuffle([...chars,...extra]).map(c=>`<div class="tileL ${ar?'ar':''}" data-ch="${c}">${c}</div>`).join('')+'</div>';
 later(()=>{ar?say(w[2],'en'):say(w[2],'ar')},400);
 enableDrag(scr,(t,slot)=>{if(!slot)return;
  if(slot.dataset.ch===t.dataset.ch){slot.textContent=t.dataset.ch;slot.classList.add('full');t.classList.add('used');tone(500+scr.querySelectorAll('.slot.full').length*100,.15);if(!ar)say(t.dataset.ch,'en');
   if(!scr.querySelector('.slot:not(.full)')){
    later(()=>{const r=$('#res');r.textContent=w[0];r.classList.add('merge');if(ar)r.classList.add('ar');$('#pic').textContent=w[1];$('#pic').style.animation='none';void $('#pic').offsetWidth;$('#pic').style.animation='';confetti();
     if(ar){say(w[0],'ar');later(()=>say(w[2],'en'),1300)}else{say(w[0],'en');later(()=>say(w[2],'ar'),1300)}
     addStar(2,praise());later(()=>buildWord(lang),3200)},500)}}else oops()})}

function harakatGame(){const lt=pick(HL,3),hk=pick(HK,3);const tl=lt[rnd(0,2)],th=hk[rnd(0,2)];let gotL=null,gotH=null;
 scr.innerHTML=title('حرف + حركة = صوت','Letter + haraka = sound')+`<div class="card"><div class="gloss">كوّن الصوت:</div><div class="huge quran" style="line-height:1.5">${tl}${th[0]}</div></div><div class="eq"><div class="slot quran" id="sl"></div><span>+</span><div class="slot quran" id="sh"></div><span>=</span><div class="res quran" id="rs">?</div></div><div class="row">`+lt.map(l=>`<button class="choice quran" data-l="${l}">${l}</button>`).join('')+`</div><div class="row">`+hk.map(h=>`<button class="choice quran" data-h="${h[0]}" style="font-size:64px;line-height:1.2">ـ${h[0]}<div class="ar" style="font-size:16px;line-height:1">${h[1]}</div></button>`).join('')+'</div>';
 function chk(){if(gotL&&gotH){if(gotL===tl&&gotH===th[0]){$('#rs').textContent=tl+th[0];$('#rs').classList.add('merge');confetti();ding();say(tl+th[0],'ar');addStar(2,praise());later(harakatGame,2600)}else{oops();gotL=gotH=null;$('#sl').textContent='';$('#sh').textContent='';$('#sl').classList.remove('full');$('#sh').classList.remove('full')}}}
 scr.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{gotL=b.dataset.l;$('#sl').textContent=gotL;$('#sl').classList.add('full');popS();chk()});
 scr.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{gotH=b.dataset.h;$('#sh').textContent=(gotH==='َ'?'ـَ':gotH==='ُ'?'ـُ':'ـِ');$('#sh').classList.add('full');popS();chk()})}
// ---------- balloons ----------
function balloons(kind){let round=0;const total=6;let alive=true;onLeave(()=>{alive=false});
 const pool=kind==='ar'?AL.map((l,i)=>({id:i,label:l[0],say:()=>say(l[1],'ar'),ar:1})):kind==='en'?EL.map((l,i)=>({id:i,label:l[0],say:()=>say(l[0]==='A'?'ay':l[0],'en')})):Array.from({length:10},(_,i)=>({id:i+1,label:String(i+1),say:()=>sayBoth(EN_NS[i+1],AR_NS[i+1])}));
 const head=kind==='ar'?title('فرقع البالون!','Pop the balloon!'):kind==='en'?'<h1>Pop the balloon!<span class="sub ar">فرقع البالون!</span></h1>':title('فرقع البالون بالرقم','Pop the number');
 scr.innerHTML=head+`<div id="prompt"></div><div id="sky"></div>`;
 const sky=$('#sky'),prompt=$('#prompt');let target,bals=[],last=0;
 function spawn(it,delay,k=0){const el=document.createElement('div');el.className='bal '+(it.ar?'ar':'');el.textContent=it.label;
  const o={el,it,x:Math.min(sky.clientWidth-96,(k%5)*(sky.clientWidth/5)+rnd(0,Math.max(0,sky.clientWidth/5-92))),y:rnd(30,Math.max(60,sky.clientHeight-130)),sp:1.2+round*.2+Math.random()*.7,ph:Math.random()*6};
  el.style.background=`radial-gradient(circle at 30% 25%,#ffffffaa,${BCOL[rnd(0,6)]} 55%)`;
  el.onclick=()=>{if(o.dead)return;if(it.id===target.id){o.dead=1;el.classList.add('pp');popS();tone(1000,.2);const r=el.getBoundingClientRect();confetti(r.left+44,r.top+50,35);bals.forEach(b=>{if(b!==o)b.sp*=0.3});
   later(()=>{el.remove();bals=bals.filter(b=>b!==o)},300);it.say();round++;
   if(round>=total){addStar(3,praise());later(()=>{if(alive)go(cur,false)},2200)}else{addStar(1);later(()=>{if(alive)newTarget()},1700)}}
   else{el.classList.remove('no');void el.offsetWidth;el.classList.add('no');oops()}};
  sky.appendChild(el);bals.push(o)}
 function newTarget(){bals.forEach(b=>b.el.remove());bals=[];target=pool[rnd(0,pool.length-1)];
  prompt.innerHTML=`<span class="${kind==='ar'?'ar':''}" style="font-size:44px">${target.label}</span> <button class="btn" id="re">🔊</button>`;$('#re').onclick=target.say;target.say();
  const others=pick(pool.filter(p=>p.id!==target.id),4);[target,...others].forEach((it,i)=>spawn(it,i*90,i));
  // extra copies keep the sky busy
  spawn(pick(pool.filter(p=>p.id!==target.id),1)[0],420,5)}
 function tick(ts){if(!alive||!document.body.contains(sky))return;
  bals.forEach(o=>{if(o.dead)return;o.y-=o.sp;const x=o.x+Math.sin(ts/700+o.ph)*14;o.el.style.transform=`translate(${x}px,${o.y}px)`;if(o.y<-130){o.y=sky.clientHeight+rnd(20,120);o.x=Math.random()*(sky.clientWidth-96)+4}});
  requestAnimationFrame(tick)}
 newTarget();requestAnimationFrame(tick);
 // balloons are absolutely placed from top-left
 sky.style.position='relative'}

const arNorm=t=>String(t||'').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[ٱأإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^\u0621-\u064A ]/g,' ').replace(/\s+/g,' ').trim();
const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]};
const wEq=(a,b)=>a===b||(a.length>3&&b.length>3&&lev(a,b)<=1);
function arScore(expected,heard){const E=arNorm(expected).split(' ').filter(Boolean);let best=0;for(const h of (heard||[])){const H=arNorm(h).split(' ').filter(Boolean);const m=Array.from({length:E.length+1},()=>new Array(H.length+1).fill(0));for(let i=1;i<=E.length;i++)for(let j=1;j<=H.length;j++)m[i][j]=wEq(E[i-1],H[j-1])?m[i-1][j-1]+1:Math.max(m[i-1][j],m[i][j-1]);best=Math.max(best,E.length?m[E.length][H.length]/E.length:0)}return best}
async function micListen(maxMs,onLevel,hold){const st=await navigator.mediaDevices.getUserMedia({audio:true});const AC2=window.AudioContext||window.webkitAudioContext;const ac=new AC2();if(ac.state==='suspended')ac.resume();const src=ac.createMediaStreamSource(st);const an=ac.createAnalyser();an.fftSize=1024;src.connect(an);const buf=new Float32Array(an.fftSize);const t0=performance.now();let prev=t0,voiced=0,floor=null,lastV=0;const calib=[];
 return new Promise(res=>{let iv;const stop=r=>{clearInterval(iv);try{st.getTracks().forEach(x=>x.stop())}catch(e){}try{ac.close()}catch(e){}res(r)};
  hold.stop=()=>stop({voiced,total:(performance.now()-t0)/1000});
  iv=setInterval(()=>{an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const r=Math.sqrt(s/buf.length);const now=performance.now(),t=now-t0,dt=(now-prev)/1000;prev=now;
   if(t<500){calib.push(r);return}
   if(floor===null)floor=Math.max(0.008,calib.reduce((a,b)=>a+b,0)/calib.length*3);
   if(r>floor){voiced+=dt;lastV=t}
   onLevel&&onLevel(Math.min(1,r/(floor*4)));
   if(t>maxMs||(voiced>0.7&&t-lastV>1800))stop({voiced,total:t/1000})},50)})}

  scr.innerHTML=`<h1 class="ar qh">${q.name}<span class="sub">${ok}/${need} ✔ · ${i+1}</span></h1><div class="card" style="text-align:center;padding:10px"><div class="gloss">اسمع الآية ثم ردّدها بصوتك<span class="sub">Listen to the ayah, then recite it</span></div><div class="row"><button class="btn go" id="pl" style="font-size:28px">🔊 اسمع</button><button class="btn go" id="mic" style="font-size:28px;background:linear-gradient(#ff7ac0,#ee2a8a);color:#fff">🎤 ردّد</button></div><div class="prog" id="lv" style="display:none"><i style="width:0%"></i></div><div class="bubble ar" id="fb" style="min-height:44px;margin-top:6px;text-align:center">…</div><div id="txt" style="display:${showTxt?'block':'none'}"><div class="ayah quran" style="font-size:32px">${L[i]}</div></div></div><div class="row" id="pj" style="display:none"><button class="btn go" id="yes" style="font-size:26px">✅ صح</button><button class="btn" id="no" style="font-size:26px">🔁 تاني</button></div><div class="row"><button class="btn" id="eye">👁 النص</button><button class="btn" id="smart">🧠 ${SRon()?'ON':'OFF'}</button></div><div class="note">The app hears whether a voice recited for about the right time. It cannot judge tajweed. A parent or teacher taps ✅ or 🔁 unless smart listening is ON (needs internet, see ❓). · التطبيق يسمع هل قرأ الطفل، والأهل يحكمون على الصحة.</div>`;
  const fb=m=>$('#fb').textContent=m;
  const play=()=>{if(busy)return;playQ(n,i,d=>{dur.v=d||3})};
  const good=()=>{ok++;addStar(1,null);ding();fb('ما شاء الله! 🌟');later(round,1100)};
  const bad=m=>{miss++;oops();fb(m);$('#pj').style.display='none';later(()=>{playQ(n,i,d=>{dur.v=d||3});busy=0},700)};
  $('#pl').onclick=play;$('#eye').onclick=()=>{const t=$('#txt');t.style.display=t.style.display==='none'?'block':'none'};
  $('#smart').onclick=()=>go(()=>parentGate(()=>{store.set('sr',!SRon());if(!SRC){alert('This browser has no speech recognition.')}draw(i)}),false);
  $('#yes').onclick=good;$('#no').onclick=()=>bad('جرّب تاني 🔁');
  $('#mic').onclick=async()=>{if(busy)return;busy=1;stopAudio();let lvEl=$('#lv');
   const ms=Math.max(6000,Math.round(((dur.v||3)*2+3)*1000));
   fb('🎤 ...اسمعك');lvEl.style.display='block';const bar=lvEl.firstChild;let r=null,sr=null,micFail=false;
   try{const p1=micListen(ms,l=>bar.style.width=(l*100)+'%',hold);const p2=SRon()?srListen(ms,hold):Promise.resolve(null);[r,sr]=await Promise.all([p1,p2])}catch(e){micFail=true}
   lvEl.style.display='none';
   if(micFail){fb('المايك مش شغال هنا. الأهل يحكموا ✅/🔁');busy=0;$('#pj').style.display='flex';return}

   fb('سمعتك! 👂 الأهل: صح؟');busy=0;$('#pj').style.display='flex'};
  later(play,500)}
 round()}

function socToc(){AREA='social';scr.innerHTML=`<h1 class="ar">محتويات الكتاب<span class="sub">Table of contents · as shown on the book's contents page</span></h1>`+SSTOC.map(u=>`<div class="card" style="text-align:start" dir="rtl"><div class="word" style="font-size:24px">${u.u}: ${u.t}</div>`+u.l.map((l,i)=>`<div style="font-size:18px;margin:6px 0">${l[1]?'✅':'⬜'} الدرس ${['الأول','الثاني','الثالث','الرابع','الخامس'][i]}: ${l[0]}${l[1]?' <small>(في التطبيق)</small>':''}</div>`).join('')+`</div>`).join('')+`<div class="note" dir="rtl">✅ = يوجد نشاط في التطبيق · ⬜ = لم يُبنَ بعد. الكتاب فيه أيضًا «أطلس الخرائط» في آخره (ص ٢٣٢). المصدر: صور فهرس الكتاب وخريطة المنهج التي أرسلها ولي الأمر.</div>`}

function socDir(st){AREA='social';st=st||{r:0,ok:0};const N=8;
 if(st.r>=N){scr.innerHTML=title('انتهت الجولة','Round finished')+`<div class="card"><div class="pic">🏁</div><div class="word">${st.ok}/${N} ⭐</div></div><div class="row"><button class="btn go" id="ag">Again · مرة أخرى</button></div>`;$('#ag').onclick=()=>socDir();return}
 let q,opts,note='';
 if(Math.random()<.5){const d=pick(DIRQ,1)[0];q=[d[0],d[1]];opts=shuffle(d[2].map((t,k)=>({t,ok:k===d[3]})))}
 else{let A,B,dx,dy,tries=0;do{[A,B]=pick(EGM.gov,2);dx=A.c[0]-B.c[0];dy=A.c[1]-B.c[1];tries++}while(Math.max(Math.abs(dx),Math.abs(dy))<Math.min(Math.abs(dx),Math.abs(dy))*2.2||Math.max(Math.abs(dx),Math.abs(dy))<70&&tries<200);
  const ans=Math.abs(dy)>Math.abs(dx)?(dy<0?'شمال':'جنوب'):(dx>0?'شرق':'غرب');
  q=['أين تقع محافظة '+A.ar+' بالنسبة إلى محافظة '+B.ar+'؟','Where is '+A.en+' compared with '+B.en+'?'];opts=shuffle(['شمال','جنوب','شرق','غرب'].map(t=>({t,ok:t===ans})));
  note=egMap({cls:{[A.id]:'target',[B.id]:'good'},dim:true,nile:false})+`<div class="note">الأصفر = ${A.ar} · الأخضر = ${B.ar} · الشمال إلى أعلى الخريطة</div>`}
 let wrong=0;
 scr.innerHTML=title('الاتجاهات','Directions · '+(st.r+1)+'/'+N)+`<div class="card"><div class="word ar" style="font-size:24px">${q[0]}<span class="sub">${q[1]}</span></div></div>${note}<div class="row">`+opts.map((o,k)=>`<button class="choice ar" data-k="${k}">${o.t}</button>`).join('')+'</div>';
 scr.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(opts[b.dataset.k].ok){b.classList.add('good');if(!wrong){st.ok++;addStar(1,praise())}st.r++;later(()=>socDir(st),1400)}else{b.classList.add('bad');wrong++;oops()}})}

 if(st.r>=N){scr.innerHTML=title('انتهت الجولة','Round finished')+`<div class="card"><div class="pic">🏁</div><div class="word">${st.ok}/${N} ⭐</div></div><div class="row"><button class="btn go" id="ag">Again · مرة أخرى</button></div>`;$('#ag').onclick=()=>socCon();return}

 $('#sq').onclick=()=>say(t[1],'ar');
 scr.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(opts[b.dataset.k]===t){b.classList.add('good');if(!wrong){st.ok++;addStar(1,praise())}st.r++;later(()=>socCon(st),1500)}else{b.classList.add('bad');wrong++;oops()}})}

 const draw=v=>{view=v||view;const g=sel&&gv(sel);

 draw()}

 scr.innerHTML=title('أين المحافظة؟','Find it on the map · '+(st.r+1)+'/'+N)+`<div class="card"><div class="word ar">اضغط على: ${t.ar}<span class="sub">${t.en}</span></div></div>`+egViews(st.view)+egMap({view:st.view,nile:false});

 scr.querySelectorAll('.gv').forEach(p=>p.onclick=()=>{if(done)return;if(p.dataset.g===t.id){done=true;p.setAttribute('fill','#4cd964');if(wrong<2){st.ok++;addStar(1,praise())}st.r++;later(()=>egFind(st),1500)}else{wrong++;p.setAttribute('fill','#ff6b6b');oops();say(gv(p.dataset.g).ar,'ar');if(wrong>=2){const tp=[...scr.querySelectorAll('.gv')].find(x=>x.dataset.g===t.id);tp.setAttribute('fill','#ffd34d');done=true;st.r++;later(()=>egFind(st),2200)}}})}

 const th=EGM.nthru.map(i=>gv(i).ar).join('، ');
 scr.innerHTML=title('نهر النيل وقناة السويس','The Nile &amp; the Suez Canal')+egMap({view:'all',nile:true,nileW:4,lm:false})+
